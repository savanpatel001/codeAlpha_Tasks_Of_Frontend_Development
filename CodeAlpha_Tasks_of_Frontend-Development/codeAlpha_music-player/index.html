<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎵 VibeWave — Music Player</title>
  <meta name="description" content="VibeWave — A stunning music player featuring Love, Mafia, and Gujarati songs with playlist, autoplay, and full audio controls."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Animated Background -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="app-container">

  <!-- Sidebar Playlist -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">VibeWave</span>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" data-category="all" id="tabAll">All</button>
      <button class="tab-btn" data-category="love" id="tabLove">💖 Love</button>
      <button class="tab-btn" data-category="mafia" id="tabMafia">🔥 Mafia</button>
      <button class="tab-btn" data-category="gujarati" id="tabGujarati">🌟 Gujarati</button>
    </div>

    <!-- Search -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search songs..." autocomplete="off"/>
    </div>

    <!-- Playlist -->
    <div class="playlist-container">
      <ul class="playlist" id="playlist"></ul>
    </div>
  </aside>

  <!-- Main Player -->
  <main class="player-main">

    <!-- Top Bar -->
    <div class="top-bar">
      <button class="menu-btn" id="menuBtn" aria-label="Open playlist">
        <span></span><span></span><span></span>
      </button>
      <div class="now-playing-label">Now Playing</div>
      <button class="shuffle-top-btn" id="shuffleTopBtn" title="Shuffle">🔀</button>
    </div>

    <!-- Album Art -->
    <div class="album-art-wrapper">
      <div class="album-ring ring-3"></div>
      <div class="album-ring ring-2"></div>
      <div class="album-ring ring-1"></div>
      <div class="album-art" id="albumArt">
        <div class="vinyl-center"></div>
        <div class="song-emoji" id="songEmoji">🎵</div>
      </div>
    </div>

    <!-- Song Info -->
    <div class="song-info">
      <div class="song-category-badge" id="categoryBadge">LOVE</div>
      <h1 class="song-title" id="songTitle">Select a Song</h1>
      <p class="song-artist" id="songArtist">— Artist Name —</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-bar-container" id="progressContainer" role="slider" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar" id="progressBar">
          <div class="progress-thumb"></div>
        </div>
      </div>
      <span class="time-label" id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn ctrl-secondary" id="repeatBtn" title="Repeat" aria-label="Toggle repeat">🔁</button>
      <button class="ctrl-btn ctrl-secondary" id="prevBtn" title="Previous" aria-label="Previous song">⏮</button>
      <button class="ctrl-btn ctrl-play" id="playPauseBtn" aria-label="Play or pause">
        <span id="playIcon">▶</span>
      </button>
      <button class="ctrl-btn ctrl-secondary" id="nextBtn" title="Next" aria-label="Next song">⏭</button>
      <button class="ctrl-btn ctrl-secondary" id="shuffleBtn" title="Shuffle" aria-label="Toggle shuffle">🔀</button>
    </div>

    <!-- Volume Control -->
    <div class="volume-section">
      <button class="volume-icon" id="muteBtn" aria-label="Toggle mute">🔊</button>
      <div class="volume-bar-container" id="volumeContainer" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="volume-bar" id="volumeBar">
          <div class="volume-thumb"></div>
        </div>
      </div>
      <span class="volume-label" id="volumeLabel">80%</span>
    </div>

    <!-- Equalizer Visualizer -->
    <div class="equalizer" id="equalizer">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>

    <!-- Song Count -->
    <div class="song-counter">
      <span id="currentSongNum">1</span> / <span id="totalSongs">100</span>
    </div>

  </main>
</div>

<!-- Hidden Audio Element -->
<audio id="audioPlayer" preload="auto"></audio>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
